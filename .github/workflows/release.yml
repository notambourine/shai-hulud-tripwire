# Cuts a release. The ordering is the point: tripwire.yml's self-reference is
# stamped to the new version and committed BEFORE the tag, so the tag contains a
# reference to itself and `tripwire.yml@<sha>` is genuinely frozen. Dependabot
# cannot do this: its bump lands one commit after the tag, which leaves every
# release running the previous release's action.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to cut, leading v optional (e.g. 1.2.0)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the version check reads existing tags, and the
          # major tag is force-moved onto the release commit.
          fetch-depth: 0
          # This job pushes the release commit and both tags, so it needs creds.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Resolve and validate version
        id: v
        env:
          RAW: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::release must be dispatched from main, got $REF"; exit 1
          fi
          ver="v${RAW#v}"
          if ! printf '%s' "$ver" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must be semver X.Y.Z, got '$RAW'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$ver" >/dev/null; then
            echo "::error::tag $ver already exists"; exit 1
          fi
          {
            echo "version=$ver"
            echo "major=${ver%%.*}"
          } >> "$GITHUB_OUTPUT"
          echo "cutting $ver (major tag ${ver%%.*})"

      - name: Stamp self-reference
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          f=.github/workflows/tripwire.yml
          sed -i -E "s|^([[:space:]]+uses: notambourine/shai-hulud-tripwire)@[^[:space:]]+|\1@${VERSION}|" "$f"
          if ! grep -qF "uses: notambourine/shai-hulud-tripwire@${VERSION}" "$f"; then
            echo "::error::self-reference not stamped in $f; did the step move?"; exit 1
          fi
          git --no-pager diff -- "$f"

      - name: Smoke-test the scanner
        run: bash scripts/supply-chain-tripwire.sh

      - name: Commit, tag, push
        env:
          VERSION: ${{ steps.v.outputs.version }}
          MAJOR: ${{ steps.v.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "release: $VERSION"
          git tag -a "$VERSION" -m "$VERSION"
          git tag -f -a "$MAJOR" -m "$MAJOR -> $VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"
          git push -f origin "$MAJOR"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release create "$VERSION" --verify-tag --latest --generate-notes

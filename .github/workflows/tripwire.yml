# Reusable workflow — gives callers a complete, isolated, zero-secret gating
# job in ~3 lines. Callers reference it as:
#
#   jobs:
#     tripwire:
#       uses: notambourine/shai-hulud-tripwire/.github/workflows/tripwire.yml@v1
#     build:
#       needs: tripwire          # build/deploy can't run until the scan is green
#       ...
#
# This job holds NO secrets (permissions: contents: read), so it is safe to run
# first and gate everything that does hold secrets.
name: Supply-chain tripwire

on:
  workflow_call:
    inputs:
      allow-globs:
        description: "Glob patterns whose content may contain IOC literals (passed through to the action)."
        type: string
        required: false
        default: ""

jobs:
  supply-chain-tripwire:
    name: Supply-chain tripwire (Shai-Hulud IOCs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checks out the CALLER's repo (workflow_call runs in the caller's context).
      # No credential persisted: the scan is read-only and never pushes.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # The composite action ships the scanner script; pinned to the v1 tag of
      # this repo. Callers who pin the workflow to a SHA may also fork+pin here.
      # Intentional self-reference to our own release tag — SHA-pinning it would
      # deadlock this repo's own tag-based release flow.
      - name: Run Shai-Hulud tripwire
        uses: notambourine/shai-hulud-tripwire@v1.1.0 # zizmor: ignore[unpinned-uses]
        with:
          allow-globs: ${{ inputs.allow-globs }}

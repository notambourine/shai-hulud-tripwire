# Dependabot — fleet convention (twice-weekly cron, cooldown-gated).
# Cadence: Mon & Wed 09:00 America/Chicago. Cooldown aligns the proposer
# with the install-time age gate so it can't PR a release the gate blocks;
# CVE security advisories bypass cooldown and still fast-track.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * 1,3"
      timezone: America/Chicago
    cooldown:
      default-days: 3
    ignore:
      # tripwire.yml's self-reference is this repo's version declaration, bumped
      # by hand in a release PR. Dependabot can only ever name an already-released
      # version there, so its PR is noise that triggers a no-op release run.
      - dependency-name: notambourine/shai-hulud-tripwire
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # A groups: block defaults to version-updates only, so without this stanza
      # every advisory opens its own PR regardless of the repo's UI toggle.
      security:
        applies-to: security-updates
        patterns:
          - "*"

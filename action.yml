name: "Shai-Hulud supply-chain tripwire"
description: "Fail-fast scan for Shai-Hulud / Mini Shai-Hulud npm-worm persistence IOCs (malicious workflows, dead-drop files, exfil domains, dropper lifecycle hooks)."
author: "notambourine"
branding:
  icon: "shield"
  color: "red"

inputs:
  allow-globs:
    description: >-
      Newline- or space-separated glob patterns whose file CONTENT may legitimately
      contain IOC literals (e.g. a security README that documents the IOCs). The
      scanner script itself is always allowed. Filename, hash, and lifecycle-script
      checks are never exempted.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # NOTE: the calling job must run actions/checkout BEFORE this step — a
    # composite action does not check out the caller's code for you. The scan
    # reads the caller's git-tracked files via `git ls-files` in $GITHUB_WORKSPACE.
    - name: Scan tracked files for known Shai-Hulud IOCs
      shell: bash
      env:
        TRIPWIRE_ALLOW: ${{ inputs.allow-globs }}
      run: bash "$GITHUB_ACTION_PATH/scripts/supply-chain-tripwire.sh"
